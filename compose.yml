version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Stand-in for Defra ID (Defra Customer Identity) for local sign-in.
  # Built from DEFRA/cdp-defra-id-stub, pinned to a commit. Users and sessions
  # are held in memory, so restarting the container wipes registered users:
  # re-run `npm run stub:seed` afterwards.
  # It must be reached at http://localhost:3200 by both the browser and this
  # app (run the app on the host with `npm run dev`), because the stub builds
  # its discovery URLs and token issuer from that address.
  # Uses the development stage: the stub's production stage fails to build
  # at this commit (its `npm ci --omit=dev` step errors).
  cdp-defra-id-stub:
    build:
      context: https://github.com/DEFRA/cdp-defra-id-stub.git#3c93db90487f58d9c277458568af0014da114f53
      target: development
    ports:
      - '3200:3200'
    environment:
      PORT: 3200
      NODE_ENV: development
      APP_BASE_URL: http://localhost:3200
      REGISTRATIONS_STORE_ENGINE: memory
      SESSION_CACHE_ENGINE: memory
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3200/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cdp-tenant

  ################################################################################

  your-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
    networks:
      - cdp-tenant

  # your-backend:
  #   image: defradigital/your-backend:${YOUR_BACKEND_VERSION:-latest}
  #   ports:
  #     - '3555:3555'
  #   links:
  #     - 'foci:floci'
  #     - 'mongodb:mongodb'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3001
  #     NODE_ENV: development
  #     MONGO_URI: mongodb://mongodb:27017/
  #   networks:
  #     - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
